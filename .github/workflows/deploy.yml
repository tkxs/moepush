name: Deploy
on:
  push:
    tags:
      - 'v*' # 匹配所有以 v 开头的 tag，如 v1.0.0
  workflow_dispatch: # 允许手动触发工作流

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        run: pnpm i -g wrangler

      - name: Run Deploy Script
        run: pnpm dlx tsx scripts/deploy.ts
        env:
          DISABLE_REGISTER: ${{ secrets.DISABLE_REGISTER }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}

      - name: Verify D1 message receipt tables
        run: |
          TABLE_RESULT=$(wrangler d1 execute "${{ secrets.D1_DATABASE_NAME }}" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('message_receipts','message_receipt_deliveries')")
          echo "$TABLE_RESULT"
          echo "$TABLE_RESULT" | grep "message_receipts"
          echo "$TABLE_RESULT" | grep "message_receipt_deliveries"

          FK_RESULT=$(wrangler d1 execute "${{ secrets.D1_DATABASE_NAME }}" --remote --command "SELECT (SELECT [table] FROM pragma_foreign_key_list('message_receipts') WHERE [from] = 'user_id' LIMIT 1) AS receipts_user_table, (SELECT [table] FROM pragma_foreign_key_list('message_receipt_deliveries') WHERE [from] = 'user_id' LIMIT 1) AS deliveries_user_table")
          echo "$FK_RESULT"
          echo "$FK_RESULT" | grep "user"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

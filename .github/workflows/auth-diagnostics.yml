name: Diagnose GitHub OAuth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Check token exchange without creating a user token
        env:
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          for (const method of ['client_secret_basic', 'client_secret_post']) {
            const params = new URLSearchParams({
              code: 'moepush-invalid-diagnostic-code',
              redirect_uri: 'https://push.tkxs.lol/api/auth/callback/github',
              grant_type: 'authorization_code',
            });
            const headers = { Accept: 'application/json' };
            if (method === 'client_secret_basic') {
              headers.Authorization = 'Basic ' + Buffer.from(
                `${process.env.AUTH_GITHUB_ID}:${process.env.AUTH_GITHUB_SECRET}`
              ).toString('base64');
            } else {
              params.set('client_id', process.env.AUTH_GITHUB_ID ?? '');
              params.set('client_secret', process.env.AUTH_GITHUB_SECRET ?? '');
            }
            const response = await fetch('https://github.com/login/oauth/access_token', {
              method: 'POST', headers, body: params,
            });
            const body = await response.json();
            console.log(JSON.stringify({ method, status: response.status, error: body.error ?? null }));
          }
          NODE
